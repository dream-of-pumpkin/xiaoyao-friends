<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <radialGradient id="moon" cx="34%" cy="30%" r="72%">
      <stop offset="0" stop-color="#F4F0E6"/>
      <stop offset="0.45" stop-color="#DAD4C6"/>
      <stop offset="0.8" stop-color="#A8A296"/>
      <stop offset="1" stop-color="#7B766B"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="40" height="40" fill="#fff"/>
      <circle cx="27" cy="12" r="14.5" fill="#000"/>
    </mask>
  </defs>
  <!-- 月轮本体：带环形山斑点的月面 -->
  <g mask="url(#crescent)">
    <circle cx="20" cy="20" r="16.5" fill="url(#moon)"/>
    <g fill="#8C8678" opacity="0.46">
      <circle cx="13" cy="17" r="3.6"/>
      <circle cx="20.5" cy="27" r="2.8"/>
      <circle cx="11" cy="27.5" r="2.1"/>
      <circle cx="22" cy="12.5" r="2.3"/>
      <circle cx="16" cy="22" r="1.7"/>
      <circle cx="25" cy="30" r="1.9"/>
      <circle cx="8.5" cy="20.5" r="1.5"/>
    </g>
    <g fill="#6C675F" opacity="0.32">
      <circle cx="18.5" cy="19.5" r="4.4"/>
      <circle cx="10.5" cy="24.5" r="2.4"/>
      <circle cx="24.5" cy="23.5" r="1.8"/>
    </g>
  </g>
  <!-- 边缘暖色辉光，勾出月牙轮廓 -->
  <path d="M20 3.5 a16.5 16.5 0 0 0 0 33 a14 14 0 0 1 0 -33 z"
        fill="none" stroke="#FBE9C4" stroke-width="1.4" opacity="0.95"/>
</svg>