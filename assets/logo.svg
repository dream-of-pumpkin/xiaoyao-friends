<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="pl" cx="36%" cy="32%" r="70%">
      <stop offset="0" stop-color="#E9A76A"/>
      <stop offset="0.55" stop-color="#B9763F"/>
      <stop offset="1" stop-color="#6E3F1F"/>
    </radialGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#B9B2A4" stop-opacity=".85"/>
    </linearGradient>
  </defs>
  <!-- 行星 -->
  <circle cx="32" cy="32" r="13" fill="url(#pl)"/>
  <!-- 表面暗斑 -->
  <g fill="#5A3319" opacity=".38">
    <ellipse cx="27" cy="28" rx="4" ry="3"/>
    <ellipse cx="36" cy="35" rx="3.4" ry="2.4"/>
    <ellipse cx="30" cy="37" rx="2.2" ry="1.6"/>
  </g>
  <!-- 高光 -->
  <ellipse cx="27" cy="26" rx="5" ry="3.4" fill="#F3C79B" opacity=".3"/>
  <!-- 轨道环 -->
  <ellipse cx="32" cy="32" rx="29" ry="10.5" fill="none" stroke="url(#rg)"
           stroke-width="1.9" transform="rotate(-27 32 32)"/>
  <!-- 环上卫星 -->
  <circle cx="57" cy="20" r="2.7" fill="#F4F1EA"/>
</svg>